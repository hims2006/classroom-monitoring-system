version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: classroom_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: classroom_monitoring
      MYSQL_USER: classroom_user
      MYSQL_PASSWORD: classroom_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - classroom_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: classroom_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - classroom_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: classroom_backend
    environment:
      DATABASE_URL: mysql+pymysql://classroom_user:classroom_password@mysql:3306/classroom_monitoring
      DATABASE_HOST: mysql
      REDIS_HOST: redis
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: "False"
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - classroom_network
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: classroom_frontend
    environment:
      VITE_API_URL: http://backend:8000
      VITE_WS_URL: ws://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - classroom_network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: classroom_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - classroom_network

volumes:
  mysql_data:
  redis_data:

networks:
  classroom_network:
    driver: bridge
